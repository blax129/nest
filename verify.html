<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Receipt status | Private Property Holdings</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #0a1628; color: #f8fafc; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      .card { width: min(420px, 100%); background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: 18px; padding: 28px; text-align: center; }
      h1 { margin: 0 0 10px; font-size: 22px; }
      p { margin: 0; color: rgba(248,250,252,0.72); }
      strong { color: #dce3ea; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Receipt verification</h1>
      <p id="statusLine">Checking status…</p>
    </div>
    <script src="./script.js"></script>
    <script>
      (function () {
        const receipt = new URLSearchParams(window.location.search).get('r') || '';
        const line = document.getElementById('statusLine');
        if (!receipt) {
          line.textContent = 'No receipt number was provided.';
          return;
        }
        window.getPublicReceiptStatus(receipt).then(function (data) {
          if (!data) {
            line.innerHTML = 'Receipt <strong>' + receipt + '</strong> was not found.';
            return;
          }
          const labels = {
            pending: 'Pending verification — this is not confirmation of cleared funds.',
            paid: 'Payment confirmed.',
            rejected: 'Payment proof rejected.',
          };
          line.innerHTML = '<strong>' + data.receipt_number + '</strong><br>' + (labels[data.status] || data.status);
        }).catch(function () {
          line.textContent = 'Unable to check this receipt right now.';
        });
      })();
    </script>
  </body>
</html>
